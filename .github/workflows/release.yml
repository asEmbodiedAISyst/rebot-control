name: Release

# Publish to PyPI when a GitHub release is published. The release tag must be "v" + the package version.
# Setup needed once:
#   - PyPI: add a trusted publisher for this repository, workflow "release.yml", environment "pypi".
#   - GitHub: Settings > Environments > create "pypi".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/rebot_control/__init__.py').read_text()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC): no token is stored in the repository
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
